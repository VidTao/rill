<!doctype html>
<html lang="en">
  <head>
    <!-- Bratrax fonts (Outfit, DM Serif Display, Space Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@1&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Rill base fonts (kept for web-common compatibility) -->
    <link href="%sveltekit.assets%/fonts/fonts.css" rel="stylesheet" />
    <link
      as="font"
      crossorigin
      href="%sveltekit.assets%/fonts/source-code/SourceCodePro-VariableFont_wght.ttf"
      rel="preload"
      type="font/woff2"
    />
    <link
      as="font"
      crossorigin
      href="%sveltekit.assets%/fonts/inter/Inter-Regular.woff2?v=3.19"
      rel="preload"
      type="font/woff2"
    />
    <link
      as="font"
      crossorigin
      href="%sveltekit.assets%/fonts/inter/Inter-Medium.woff2?v=3.19"
      rel="preload"
      type="font/woff2"
    />
    <link
      as="font"
      crossorigin
      href="%sveltekit.assets%/fonts/inter/Inter-SemiBold.woff2?v=3.19"
      rel="preload"
      type="font/woff2"
    />
    <link
      as="font"
      crossorigin
      href="%sveltekit.assets%/fonts/inter/Inter-Bold.woff2?v=3.19"
      rel="preload"
      type="font/woff2"
    />
    <link
      as="font"
      crossorigin
      href="%sveltekit.assets%/fonts/inter/Inter-ExtraBold.woff2?v=3.19"
      rel="preload"
      type="font/woff2"
    />
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta name="theme-color" content="#0A0A0A" />

    <title>Bratrax — D2C Attribution Analytics for the AI Era</title>
    <meta name="description" content="Attribution analytics for D2C brands. Flat pricing that doesn't scale with revenue, data you own and can export, and an open layer for your own AI." />

    <!-- Open Graph (Facebook, LinkedIn, Slack, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bratrax.com/" />
    <meta property="og:title" content="Bratrax — D2C Attribution Analytics for the AI Era" />
    <meta property="og:description" content="Flat-price D2C attribution. Data you own. Open layer for your own AI." />
    <meta property="og:image" content="https://bratrax.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Bratrax" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://bratrax.com/" />
    <meta name="twitter:title" content="Bratrax — D2C Attribution Analytics for the AI Era" />
    <meta name="twitter:description" content="Flat-price D2C attribution. Data you own. Open layer for your own AI." />
    <meta name="twitter:image" content="https://bratrax.com/og-image.jpg" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%sveltekit.assets%/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="%sveltekit.assets%/favicon-256x256.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="svelte">%sveltekit.body%</div>
    <div id="rill-portal"></div>
  </body>
</html>
